  html += '<div class="pills">' + water.days.map((item, index) => '<button data-day="' + index + '" aria-pressed="' + (index === dayIndex) + '">' + esc(dayLabel(item.date, index)) + "</button>").join("") + "</div>";
  if (!dayHours(day).length) return html + waterFooter();
  const sea = marineDay(day, entry.marine);
  return html + (state.prefs.view === "sailor" ? sailorBody(day, spot, sea) : simpleBody(day, spot, sea)) + waterFooter();
}
function waterCard(spot) {
  const entry = state.cache[spot.id] || {}, water = entry.water, today = water && water.days[0];
  let html = '<button class="card" data-open="' + esc(spot.id) + '"><span class="row" style="width:100%"><h2>' + esc(spot.name) + '</h2><span class="small muted" style="flex:none">' + esc(kindName(spot.kind)) + "</span></span>" +
    '<span class="small muted">' + (water ? esc(tr("updated")) + " " + esc(clock(water.fetchedAt)) : esc(tr(entry.error ? "loadFail" : "loading"))) + "</span>";
  if (today && dayHours(today).length) {
    const peak = peakHour(today), strong = dayHours(today).reduce((best, hour) => !best || hour.wind > best.wind ? hour : best, null);
    html += '<span class="summary">' + windArrow(strong.dir, 24) + "<span>" + esc(tr("wind")) + " " + esc(speedText(strong.wind)) + " " + esc(tr("windFrom", { d: dirName(strong.dir) })) + " · " + esc(tr("gusts")) + " " + esc(speedText(peak.gust)) +
      "<br>" + esc(windowTitle(today, spot)) + "</span></span>";
  }
  return html + "</button>";
}
function kindPicker() {
  return '<div class="stack" style="gap:6px"><span class="small muted">' + esc(tr("addAs")) + '</span><div class="seg kinds" role="group" aria-label="' + esc(tr("addAs")) + '">' +
    ["mountain"].concat(WATER_KINDS).map(kind => '<button data-kind="' + kind + '" aria-pressed="' + (addKind === kind) + '">' + esc(kindName(kind)) + "</button>").join("") + "</div></div>";
}
function renderPrefs() {
  const prefs = state.prefs, choice = (title, key, options, note) => '<div class="stack" style="gap:6px"><b style="font-weight:600">' + esc(title) + '</b><div class="seg wide" role="group" aria-label="' + esc(title) + '">' +
    options.map(option => '<button data-pref="' + key + ":" + option[0] + '" aria-pressed="' + (prefs[key] === option[0]) + '">' + esc(option[1]) + "</button>").join("") + "</div>" + (note ? '<span class="small muted">' + esc(note) + "</span>" : "") + "</div>";
  const stepper = (kind, edge) => '<span class="stepper"><button data-limit="' + kind + ":" + edge + ':-1" aria-label="-">−</button><b>' + esc(speedText(prefs.limits[kind][edge])) + '</b><button data-limit="' + kind + ":" + edge + ':1" aria-label="+">+</button></span>';
  let html = '<header style="display:flex;flex-direction:column;gap:6px"><div><button class="iconbtn" data-back="1" aria-label="' + esc(tr("back")) + '" style="margin-left:-10px">' + icon("back", 24) + "</button></div><h1>" + esc(tr("prefs")) +
    '</h1><div class="muted" style="font-size:14px">' + esc(tr("prefsSaved")) + "</div></header>" +
    '<section class="stack" style="gap:18px"><div class="label">' + esc(tr("detail")) + "</div>" + choice(tr("viewLabel"), "view", [["simple", tr("simple")], ["sailor", tr("sailor")]], tr("viewNote")) + "</section>" +
    '<section class="stack" style="gap:18px"><div class="label">' + esc(tr("units")) + "</div>" + choice(tr("windSpeed"), "unit", [["auto", tr("unitAuto")], ["kmh", "km/h"], ["kn", "kn"], ["ms", "m/s"]], tr("bftNote")) +
    choice(tr("arrowsLabel"), "arrows", [["to", tr("arrTo")], ["from", tr("arrFrom")]], tr("arrNote")) + "</section>" + '<section class="stack"><div class="label">' + esc(tr("limits")) + "</div>";
  for (const kind of WATER_KINDS) {
    html += '<div class="limitrow"><b style="font-weight:600">' + esc(kindName(kind)) + "</b>" + (prefs.limits[kind].min ? '<span class="row"><span class="small muted">' + esc(tr("limitMin")) + "</span>" + stepper(kind, "min") + "</span>" : "") +
      '<span class="row"><span class="small muted">' + esc(tr("limitTop")) + "</span>" + stepper(kind, "max") + "</span></div>";
  }
  return html + '<span class="small muted">' + esc(tr("limitsNote")) + "</span></section>" + waterFooter();
}
function mergePrefs(saved) {
  const prefs = JSON.parse(JSON.stringify(DEFAULT_PREFS));
  if (!saved) return prefs;
  if (["simple", "sailor"].includes(saved.view)) prefs.view = saved.view;
  if (["auto", "kn", "kmh", "ms"].includes(saved.unit)) prefs.unit = saved.unit;
  if (["to", "from"].includes(saved.arrows)) prefs.arrows = saved.arrows;
  for (const kind of WATER_KINDS) for (const edge in prefs.limits[kind]) { const value = saved.limits && saved.limits[kind] && saved.limits[kind][edge]; if (typeof value === "number" && value > 0 && value < 100) prefs.limits[kind][edge] = value; }
  return prefs;
}
function changeLimit(kind, edge, step) {
  const limit = state.prefs.limits[kind], value = limit[edge] + step;
  if (value < 1 || value > 70 || (edge === "min" && value >= limit.max) || (edge === "max" && limit.min && value <= limit.min)) return;
  limit[edge] = value;
}
/* Sea data is a separate request that is not waited for, so a lake or an outage never blocks the wind forecast. */
async function loadMarine(spot, entry) {
  try { entry.marine = shapeMarine(await fetchJson(marineUrl(spot))); } catch (error) { if (!entry.marine) entry.marine = { none: true, fetchedAt: Date.now() }; }
  saveState();
  if (!document.querySelector("#results button, #q:focus")) render();
}
async function refreshWater(spot) {
  const entry = state.cache[spot.id] || (state.cache[spot.id] = {});
  entry.error = false;
  try { const water = shapeWater(await fetchJson(waterUrl(spot))); if (!water.days.length) throw new Error("no wind values"); entry.water = water; } catch (error) { entry.error = true; }
  loadMarine(spot, entry);
  saveState();
  if (!document.querySelector("#results button, #q:focus")) render();
}

/* ---------- Loading and saving ---------- */
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && Array.isArray(saved.spots)) state = { lang: LANGS.includes(saved.lang) ? saved.lang : state.lang, spots: saved.spots, cache: saved.cache || {}, prefs: mergePrefs(saved.prefs) };
  } catch (error) { /* start empty */ }
  if (!state.prefs) state.prefs = mergePrefs(null);
  for (const id in state.cache) if (state.cache[id].forecast && state.cache[id].forecast.days.some(day => !day.hours || (day.hours[0] && day.hours[0].isDay === undefined))) delete state.cache[id];
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (error) { /* storage unavailable */ } }
async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}
function getBulletin(lang) {
  if (!bulletinPromises[lang]) bulletinPromises[lang] = fetchJson(bulletinUrl(lang)).catch(error => { delete bulletinPromises[lang]; throw error; });
  return bulletinPromises[lang];
}
/* Separate request that is not waited for, so cloud data never delays or blocks the forecast and the bulletin. */
async function loadCloud(spot, entry) {
  try {
    entry.cloud = shapeCloud(await fetchJson(cloudUrl(spot)), entry.forecast.elevation);
    saveState();
    if (!document.querySelector("#results button, #q:focus")) render();
  } catch (error) { /* keep the last saved cloud data */ }
}
function hasValues(json) {
  return !!(json && json.hourly && (json.hourly.temperature_2m || []).some(value => value !== null && value !== undefined));
}
// The MeteoSwiss models cover the Alps and central Europe only; elsewhere fall back to Open-Meteo's best match.
async function loadForecast(spot) {
  let json = null;
  try { json = await fetchJson(forecastUrl(spot, "meteoswiss_icon_seamless")); } catch (error) { json = null; }
  const wide = !hasValues(json);
  if (wide) json = await fetchJson(forecastUrl(spot, "best_match"));
  if (!hasValues(json)) throw new Error("no forecast values");
  const forecast = shapeForecast(json);
  forecast.wide = wide;
  return forecast;
}
async function refreshSpot(spot) {
  if (isWater(spot)) return refreshWater(spot);
  const entry = state.cache[spot.id] || (state.cache[spot.id] = {});
  entry.error = false;
  try { entry.forecast = await loadForecast(spot); } catch (error) { entry.error = true; }
  if (entry.forecast && entry.forecast.elevation !== null) loadCloud(spot, entry);
  try {
    const bulletin = await getBulletin(state.lang);
    if (!bulletin.features || !bulletin.features.length) entry.avalanche = { status: "none" };
    else { const feature = findBulletinFeature(bulletin, spot.lat, spot.lon); entry.avalanche = feature ? { status: "ok", summary: summarizeBulletin(feature) } : { status: "outside" }; }
  } catch (error) { if (!entry.avalanche || entry.avalanche.status !== "ok") entry.avalanche = { status: "error" }; }
  saveState();
  if (!document.querySelector("#results button, #q:focus")) render();
}
function addSpot(name, lat, lon, elevation) {
  const spot = { id: "s" + Date.now(), name, lat, lon };
  if (addKind !== "mountain") spot.kind = addKind;
  else if (typeof elevation === "number") spot.elevation = elevation;
  state.spots.unshift(spot); saveState(); render(); refreshSpot(spot);
}
let searchResults = [];
async function onSearch(event) {
  event.preventDefault();
  const input = document.getElementById("q"), results = document.getElementById("results"), query = input.value.trim();
  if (!query) return;
  const coordinates = parseCoordinates(query);
  if (coordinates) return addSpot(coordinates.lat.toFixed(3) + ", " + coordinates.lon.toFixed(3), coordinates.lat, coordinates.lon);
  results.innerHTML = '<p class="muted" style="margin:0">' + esc(tr("searching")) + "</p>";
  try {
    searchResults = (await fetchJson(geocodeUrl(query))).results || [];
    results.innerHTML = searchResults.length ? searchResults.map((place, index) => '<button type="button" data-pick="' + index + '">' + esc(place.name) +
      ' <span class="small muted">' + esc([place.admin1, place.country, typeof place.elevation === "number" ? Math.round(place.elevation) + " m" : ""].filter(Boolean).join(" · ")) + "</span></button>").join("")
      : '<p class="muted" style="margin:0">' + esc(tr("nothing")) + "</p>";
  } catch (error) { results.innerHTML = '<p class="err" style="margin:0">' + esc(tr("searchFailed")) + "</p>"; }
}
function onClick(event) {
  const target = event.target.closest("[data-lang],[data-open],[data-home],[data-tab],[data-day],[data-remove],[data-pick],[data-print],[data-share],[data-kind],[data-pref],[data-limit],[data-shore],[data-prefs],[data-back]");
  if (!target) return;
  const data = target.dataset;
  if (data.lang) { state.lang = data.lang; saveState(); render(); state.spots.forEach(refreshSpot); }
  else if (data.open) { location.hash = "spot-" + data.open; }
  else if (data.home) { location.hash = ""; }
  else if (data.tab) { view.tab = data.tab; render(); }
  else if (data.day) { view.day = Number(data.day); render(); }
  else if (data.remove) { state.spots = state.spots.filter(spot => spot.id !== data.remove); delete state.cache[data.remove]; saveState(); location.hash = ""; render(); }
  else if (data.print || data.share) { const spot = state.spots.find(item => item.id === (data.print || data.share)); if (spot) (data.print ? printReport : shareReport)(spot); }
  else if (data.kind) { addKind = data.kind; document.querySelectorAll("[data-kind]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.kind === addKind))); }
  else if (data.pref) { const pair = data.pref.split(":"); state.prefs[pair[0]] = pair[1]; saveState(); render(); }
  else if (data.limit) { const parts = data.limit.split(":"); changeLimit(parts[0], parts[1], Number(parts[2])); saveState(); render(); }
  else if (data.shore) { const parts = data.shore.split(":"), spot = state.spots.find(item => item.id === parts[0]); if (spot) { if (parts[1] === "x") delete spot.shore; else spot.shore = Number(parts[1]); saveState(); render(); } }
  else if (data.prefs) { prefsBack = location.hash; location.hash = "prefs"; }
  else if (data.back) { location.hash = prefsBack; }
  else if (data.pick) { const place = searchResults[Number(data.pick)]; addSpot(place.name, place.latitude, place.longitude, place.elevation); }
}
function onHash() {
  const match = /^#spot-(.+)$/.exec(location.hash);
  view = location.hash === "#prefs" ? { name: "prefs", tab: "day", day: 0 } : match ? { name: "spot", id: match[1], tab: "day", day: 0 } : { name: "home", tab: "day", day: 0 };
  render(); window.scrollTo(0, 0);
}
function init() {
  const browserLang = (navigator.language || "en").slice(0, 2);
  if (LANGS.includes(browserLang)) state.lang = browserLang;
  loadState();
  document.addEventListener("click", onClick);
  document.addEventListener("submit", event => { if (event.target.id === "search") onSearch(event); });
  window.addEventListener("hashchange", onHash);
  onHash();
  state.spots.forEach(refreshSpot);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (typeof document !== "undefined") init();
</script>
