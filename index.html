<style>

  body { margin:0; background:var(--cream); color:var(--navy);
    font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { max-width:560px; margin:0 auto; padding:24px 20px 48px; display:flex; flex-direction:column; gap:20px; }

  h2 { margin:0; font-size:22px; font-weight:500; overflow-wrap:break-word; }
  a { color:var(--navy); }
  button { font:inherit; color:var(--navy); cursor:pointer; }
  .muted { color:var(--slate); }
  .small { font-size:12px; }
  .label { font-size:12px; font-weight:600; letter-spacing:1.2px; color:var(--slate); text-transform:uppercase; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .iconbtn { width:44px; height:44px; background:none; border:0; display:flex; align-items:center; justify-content:center; }
  .seg { display:flex; border:1.2px solid var(--navy); border-radius:99px; overflow:hidden; }
  .seg button { height:44px; padding:0 12px; border:0; background:none; font-size:13px; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:var(--cream); font-weight:600; }
  .pills { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .pills button { flex:none; height:44px; padding:0 14px; border-radius:99px; border:1.2px solid var(--navy); background:none; font-size:13px; }
  .pills button[aria-pressed="true"] { background:var(--navy); color:var(--cream); font-weight:600; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; height:48px; padding:0 14px; border:1.2px solid var(--navy); border-radius:12px; background:#FFFDF8; color:var(--navy); font:inherit; font-size:16px; }
  .primary { height:48px; padding:0 18px; border-radius:12px; border:1.2px solid var(--navy); background:var(--navy); color:var(--cream); font-weight:600; }
  #results { display:flex; flex-direction:column; gap:6px; }
  #results button { text-align:left; min-height:48px; padding:8px 14px; border-radius:12px; border:1.2px solid var(--line); background:#FFFDF8; }
  .card { display:flex; flex-direction:column; gap:8px; width:100%; text-align:left; border:1.2px solid var(--navy); border-radius:14px; padding:16px; background:none; }
  .chip { flex:none; border:1.2px solid var(--navy); border-radius:6px; padding:0 7px; font-size:18px; font-weight:600; color:var(--navy); }
  .summary { display:flex; gap:10px; align-items:center; font-size:14px; }
  .tiles { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
  .tile { border:1.2px solid var(--navy); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .tile b { font-size:22px; font-weight:600; }
  .tile b span { font-size:12px; font-weight:400; }
  .timeline { display:grid; grid-template-columns:52px 24px minmax(0, 1fr); column-gap:10px; }
  .timeline .time { font-size:14px; font-weight:600; padding-bottom:20px; }
  .timeline .rail { display:flex; flex-direction:column; align-items:center; }
  .timeline .rail i { flex:1; width:1.5px; background:var(--navy); }
  .timeline .dot { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--navy); margin-top:5px; flex:none; }
  .timeline .text { padding-bottom:20px; }
  .timeline .text b { font-weight:500; display:block; }
  .timeline .last { padding-bottom:0; }
  .hours { display:grid; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:4px; text-align:center; font-size:12px; }
  .hours > div { display:flex; flex-direction:column; gap:4px; align-items:center; background:var(--tile); border-radius:8px; padding:8px 0; }
  .hours b { font-size:14px; }
  .facts { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 14px; }
  .facts b { display:block; font-size:20px; font-weight:500; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden; }

  .rule { border-top:1px solid var(--line); padding-top:20px; }
  .err { color:#9C1F17; font-size:14px; }
  ul { margin:0; padding-left:18px; font-size:14px; }

  #print svg [fill]:not([fill="none"]) { fill:#fff !important; }

  .pk { font-size:7.5pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
  .phead { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; border-bottom:2pt solid #000; padding-bottom:9px; }
  .pmeta { font-size:8.5pt; }
  .phero { display:flex; gap:10px; align-items:center; max-width:46%; }
  .phero b { display:block; font-size:13pt; line-height:1.2; }
  .pbadge { flex:none; min-width:56px; height:56px; padding:0 7px; background:#000; color:#fff; border:1.5pt solid #000; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:24pt; font-weight:700; }
  .pbadge.empty { background:#fff; color:#000; }
  .pstats { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); row-gap:10px; }
  .pstats > div { padding:0 12px; border-left:.75pt solid #000; display:flex; flex-direction:column; }

  .pstats b { font-size:13.5pt; line-height:1.3; white-space:nowrap; }
  .psub { font-size:8pt; }
  .pcols { display:grid; grid-template-columns:minmax(0, 11fr) minmax(0, 9fr); gap:26px; }
  .ptitle { border-bottom:.75pt solid #000; padding-bottom:3px; margin-bottom:7px; }
  .ptl { display:grid; grid-template-columns:38px 10px minmax(0, 1fr); column-gap:8px; }
  .ptl .time { font-weight:700; }
  .ptl .rail { display:flex; flex-direction:column; align-items:center; }
  .ptl .rail i { width:7px; height:7px; border-radius:50%; border:1.2pt solid #000; background:#fff; margin-top:4px; flex:none; }
  .ptl .rail span { flex:1; width:1pt; background:#000; }
  .ptl .what { padding-bottom:7px; }
  .pcloud { display:flex; gap:8px; align-items:flex-start; padding-bottom:6px; }
  .plist { margin:0 0 4px; padding-left:14px; }
  #print table { width:100%; border-collapse:collapse; font-size:8.5pt; text-align:center; table-layout:fixed; font-variant-numeric:tabular-nums; }
  #print th, #print td { border-bottom:.5pt solid #999; padding:3px 0; font-weight:400; vertical-align:middle; }
  #print thead th { border-bottom:1pt solid #000; font-weight:700; }
  #print tbody tr:last-child td { border-bottom:1pt solid #000; }
  #print th:first-child, #print td:first-child { text-align:left; width:20%; font-weight:600; }
  #print table.pnext th:first-child, #print table.pnext td:first-child { width:24%; }
  #print table.pnext th:nth-child(2), #print table.pnext td:nth-child(2) { width:6%; }
  #print .night { background:#EDEDED; }
  .pbarbox { height:14px; display:flex; align-items:flex-end; justify-content:center; }
  .pbarbox i { display:block; width:10px; background:#000; }
  .pfoot { font-size:7.5pt; color:#222; }

    #print { display:flex; flex-direction:column; gap:15px; max-width:none; margin:0; padding:0; }
    #print section, .pcloud { break-inside:avoid; }
  }
  footer { color:var(--slate); font-size:12px; border-top:1px solid var(--line); padding-top:16px; }

function loadState() {
  try {

  } catch (error) { /* start empty */ }
  for (const id in state.cache) if (state.cache[id].forecast && state.cache[id].forecast.days.some(day => !day.hours || (day.hours[0] && day.hours[0].isDay === undefined))) delete state.cache[id];
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (error) { /* storage unavailable */ } }
async function fetchJson(url) {

}

  const wide = !hasValues(json);

async function refreshSpot(spot) {

  if (entry.forecast && entry.forecast.elevation !== null) loadCloud(spot, entry);

    results.innerHTML = searchResults.length ? searchResults.map((place, index) => '<button type="button" data-pick="' + index + '">' + esc(place.name) +
      ' <span class="small muted">' + esc([place.admin1, place.country, typeof place.elevation === "number" ? Math.round(place.elevation) + " m" : ""].filter(Boolean).join(" · ")) + "</span></button>").join("")
      : '<p class="muted" style="margin:0">' + esc(tr("nothing")) + "</p>";
  } catch (error) { results.innerHTML = '<p class="err" style="margin:0">' + esc(tr("searchFailed")) + "</p>"; }
}
function onClick(event) {
  const target = event.target.closest("[data-lang],[data-open],[data-home],[data-tab],[data-day],[data-remove],[data-pick],[data-print],[data-share]");
  if (!target) return;
  const data = target.dataset;
  if (data.lang) { state.lang = data.lang; saveState(); render(); state.spots.forEach(refreshSpot); }
  else if (data.open) { location.hash = "spot-" + data.open; }
  else if (data.home) { location.hash = ""; }
  else if (data.tab) { view.tab = data.tab; render(); }
  else if (data.day) { view.day = Number(data.day); render(); }
  else if (data.remove) { state.spots = state.spots.filter(spot => spot.id !== data.remove); delete state.cache[data.remove]; saveState(); location.hash = ""; render(); }
  else if (data.print || data.share) { const spot = state.spots.find(item => item.id === (data.print || data.share)); if (spot) (data.print ? printReport : shareReport)(spot); }
  else if (data.pick) { const place = searchResults[Number(data.pick)]; addSpot(place.name, place.latitude, place.longitude, place.elevation); }
}
function onHash() {
  const match = /^#spot-(.+)$/.exec(location.hash);
  view = match ? { name: "spot", id: match[1], tab: "day", day: 0 } : { name: "home", tab: "day", day: 0 };
  render(); window.scrollTo(0, 0);
}
function init() {
  const browserLang = (navigator.language || "en").slice(0, 2);
  if (LANGS.includes(browserLang)) state.lang = browserLang;
  loadState();
  document.addEventListener("click", onClick);
  document.addEventListener("submit", event => { if (event.target.id === "search") onSearch(event); });
  window.addEventListener("hashchange", onHash);
  onHash();
  state.spots.forEach(refreshSpot);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (typeof document !== "undefined") init();
</script>
</body>
