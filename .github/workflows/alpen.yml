name: Lawinenbulletins Alpen

on:
  schedule:
    - cron: "20 6,7,16,17,19 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/alpen.mjs
      - .github/workflows/alpen.yml

permissions:
  contents: write

concurrency: alpen

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/alpen.mjs
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verlauf/alpen.json verlauf/alpen-log.json
          git diff --cached --quiet || (git commit -m "chore: updated Alpine avalanche bulletins" && git pull --rebase && git push)
