  const dayParts = renderDayTab(day, entry.avalanche, entry.cloud).split("<!--hours-->"), detailParts = renderDetailsTab(day, entry.avalanche, forecast.elevation, spot).split("<!--ava-->");
  return html + '<div class="cols" data-tab="' + (view.tab === "details" ? "details" : "day") + '"><div class="col">' + detailParts[0] + dayParts[0] +
    '</div><div class="col">' + renderOutlook(forecast, dayIndex, entry.compare) + detailParts[1] + '</div><div class="col col-wide">' + dayParts[1] + "</div></div>" +
    '<div class="actions"><button data-print="' + esc(spot.id) + '">' + esc(tr("print")) + '</button><button data-share="' + esc(spot.id) + '">' + esc(tr("share")) + "</button></div>" + footer();
}
function reportDay(spot) {
  const entry = state.cache[spot.id] || {}, forecast = entry.forecast;

  return { entry, forecast, index, day: forecast.days[index] };
}
function avalancheLine(avalanche) {
  if (!avalanche || avalanche.status !== "ok") return tr(!avalanche || avalanche.status === "error" ? "avaError" : avalanche.status === "none" ? "avaNone" : "avaOutside");
  const top = avalanche.summary.top;
  return (top ? (top.level ? top.level + top.sign + " " : "") + dangerWord(top.value) + (whereText(top) ? " · " + whereText(top) : "") : tr("na")) +
    avalanche.summary.problems.map(problem => "; " + problemWord(problem.type)).join("");
}
function renderReport(spot) {
  const report = reportDay(spot);
  if (!report) return "";
  const day = report.day, forecast = report.forecast, avalanche = report.entry.avalanche;
  const ok = avalanche && avalanche.status === "ok", top = ok ? avalanche.summary.top : null;
  const longDate = date => new Date(date + "T12:00:00").toLocaleDateString(LOCALES[state.lang], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const stat = (label, value, sub) => '<div><span class="pk">' + esc(label) + "</span><b>" + esc(value) + '</b><span class="psub">' + esc(sub || "") + "</span></div>";
  const title = label => '<div class="pk ptitle">' + esc(label) + "</div>";
  let html = '<header class="phead"><div><div class="pk">Bergwetter · ' + esc(longDate(day.date)) + "</div><h1>" + esc(spot.name) + '</h1><div class="pmeta">' +
    (forecast.elevation !== null ? forecast.elevation + " m · " : "") + spot.lat.toFixed(3) + ", " + spot.lon.toFixed(3) + " · " + esc(tr("updated")) + " " + esc(clock(forecast.fetchedAt)) + " · " + esc(tr("exported")) + " " + esc(clock(Date.now())) + "</div></div>" +
    '<div class="phero"><div class="pbadge' + (top && top.level ? "" : " empty") + '">' + (top && top.level ? top.level + esc(top.sign) : "–") + '</div><div><span class="pk">' + esc(tr("avalanche")) + "</span><b>" +
    esc(top ? dangerWord(top.value) : tr("na")) + '</b><span class="psub">' + esc(top ? whereText(top) : avalancheLine(avalanche)) + "</span></div></div></header>";
  html += '<section class="pstats">' +
    stat(tr("gusts"), show(day.gustMax, " km/h"), "max") +
    stat(tr("sunshine"), show(day.sunHours, " h"), tr("ofDaylight", { h: show(day.daylightHours) })) +
    stat(tr("temperature"), show(day.tempMin, "°") + " " + tr("to") + " " + show(day.tempMax, "°C")) +
    stat(tr("newSnow"), show(day.snowCm, " cm")) +
    stat(tr("precipitation"), show(day.precipMm, " mm")) +
    stat(tr("freezing"), day.freezingMin === null ? tr("na") : day.freezingMax !== day.freezingMin ? day.freezingMin + "–" + day.freezingMax + " m" : day.freezingMin + " m") + "</section>";
  const events = dayEvents(day);
  html += '<section class="pcols"><div>' + title(tr("yourDay")) + '<div class="ptl">' + events.map((event, index) =>
    '<div class="time">' + esc(event.time) + '</div><div class="rail"><i></i>' + (index === events.length - 1 ? "" : "<span></span>") + '</div><div class="what"><b>' + esc(event.title) + "</b>" + (event.sub ? '<br><span class="psub">' + esc(event.sub) + "</span>" : "") + "</div>").join("") + "</div></div><div>";
  const segments = cloudSegments(day, report.entry.cloud);
  html += title(tr("cloudTitle")) + (segments.length ? segments.map(segment => {
    const view = segmentView(segment);
    return '<div class="pcloud">' + icon(view.kind, 22) + "<div><b>" + esc(tr("from")) + " " + hourText(segment.from) + ": " + esc(view.title) + "</b>" + (view.detail ? '<br><span class="psub">' + esc(view.detail) + "</span>" : "") + "</div></div>";
  }).join("") : "<div>" + esc(tr("cloudNA")) + "</div>");
  if (ok) {
    const lines = avalanche.summary.ratings.filter(rating => rating !== top).map(rating => (rating.level || "") + " " + dangerWord(rating.value) + (whereText(rating) ? " · " + whereText(rating) : ""))
      .concat(avalanche.summary.problems.map(problem => problemWord(problem.type) + (whereText(problem) ? " · " + whereText(problem) : "")));
    html += '<div style="margin-top:8px">' + title(tr("avaOfficial")) + "</div>" + (lines.length ? '<ul class="plist">' + lines.map(line => "<li>" + esc(line) + "</li>").join("") + "</ul>" : "") +
      (avalanche.summary.validUntil ? '<div class="psub">' + esc(tr("validUntil")) + " " + esc(clock(avalanche.summary.validUntil)) + "</div>" : "");
  }
  html += "</div></section>";
  const hours = day.hours.filter(hour => hour.hour >= 5 && hour.hour <= 21);
  const shade = hour => hour.isDay ? "" : ' class="night"';
  const row = (label, cell) => "<tr><td>" + esc(label) + "</td>" + hours.map(hour => "<td" + shade(hour) + ">" + cell(hour) + "</td>").join("") + "</tr>";
  const plain = value => value === null || value === undefined ? "–" : value;
  html += "<section>" + title(tr("hourByHour")) + "<table><thead><tr><th></th>" + hours.map(hour => "<th" + shade(hour) + ">" + String(hour.hour).padStart(2, "0") + "</th>").join("") + "</tr></thead><tbody>" +
    row("", hour => icon(weatherKind(hour), 16)) +
    row(tr("temperature") + " (°C)", hour => plain(hour.temp)) +
    row(tr("gusts") + " (km/h)", hour => hour.gust >= 60 ? "<b>" + hour.gust + "</b>" : plain(hour.gust)) +
    row(tr("sunshine"), hour => '<div class="pbarbox"><i style="height:' + Math.round(14 * (hour.sunMinutes || 0) / 60) + 'px"></i></div>') +
    row(tr("precipitation") + " (mm)", hour => hour.precip > 0 ? hour.precip : "") +
    row(tr("newSnow") + " (cm)", hour => hour.snow > 0 ? hour.snow : "") + '</tbody></table><div class="psub" style="margin-top:3px">' + esc(tr("tableLegend")) + "</div></section>";
  const later = forecast.days.slice(report.index + 1, report.index + 5);
  if (later.length) html += "<section>" + title(tr("nextDays")) + '<table class="pnext"><thead><tr><th></th><th></th><th>' + [tr("sunshine"), tr("temperature"), tr("gusts"), tr("newSnow"), tr("precipitation")].map(esc).join("</th><th>") + "</th></tr></thead><tbody>" +
    later.map(next => "<tr><td>" + esc(new Date(next.date + "T12:00:00").toLocaleDateString(LOCALES[state.lang], { weekday: "long", day: "numeric", month: "short" })) + "</td><td>" + icon(dayKind(next), 16) + "</td><td>" + show(next.sunHours, " h") + "</td><td>" +
      show(next.tempMin, "°") + " " + esc(tr("to")) + " " + show(next.tempMax, "°C") + "</td><td>" + (next.gustMax >= 60 ? "<b>" + next.gustMax + " km/h</b>" : show(next.gustMax, " km/h")) + "</td><td>" + show(next.snowCm, " cm") + "</td><td>" + show(next.precipMm, " mm") + "</td></tr>").join("") + "</tbody></table></section>";
  return html + '<div class="pfoot">' + esc(tr("footNote")) + " " + esc(tr("cloudLegend")) + " " + esc(tr("astro")) + "<br>" + esc(forecast.wide ? tr("wideModel") : tr("footForecast")) + " " + esc(tr("footAva")) + " " + esc(tr("footCloud")) + "</div>";
}
function reportText(spot) {
  const report = reportDay(spot);
  if (!report) return "";
  const day = report.day, forecast = report.forecast, lines = [];
  lines.push("Bergwetter · " + spot.name + (forecast.elevation !== null ? " (" + forecast.elevation + " m)" : ""));
  lines.push(new Date(day.date + "T12:00:00").toLocaleDateString(LOCALES[state.lang], { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
  lines.push(tr("updated") + " " + clock(forecast.fetchedAt), "");
  lines.push(tr("sunshine") + ": " + show(day.sunHours, " h") + " (" + tr("ofDaylight", { h: show(day.daylightHours) }) + ")");
  lines.push(tr("sunrise") + " / " + tr("sunset") + ": " + show(day.sunrise) + " / " + show(day.sunset));
  lines.push(tr("temperature") + ": " + show(day.tempMin, "°") + " " + tr("to") + " " + show(day.tempMax, "°C"));
  lines.push(tr("gusts") + ": " + show(day.gustMax, " km/h"));
  lines.push(tr("newSnow") + ": " + show(day.snowCm, " cm") + " · " + tr("precipitation") + ": " + show(day.precipMm, " mm"));
  if (day.freezingMin !== null) lines.push(tr("freezing") + ": " + day.freezingMin + (day.freezingMax !== day.freezingMin ? " " + tr("to") + " " + day.freezingMax : "") + " m");
  const segments = cloudSegments(day, report.entry.cloud);
  if (segments.length) lines.push("", tr("cloudTitle") + ":");
  for (const segment of segments) lines.push("  " + tr("from") + " " + hourText(segment.from) + ": " + segmentView(segment).title);
  lines.push("", tr("yourDay") + ":");
  for (const event of dayEvents(day)) lines.push("  " + event.time + "  " + event.title + (event.sub ? " (" + event.sub + ")" : ""));
  lines.push("", tr("avalanche") + ": " + avalancheLine(report.entry.avalanche), "", tr("footNote"), (forecast.wide ? tr("wideModel") : tr("footForecast")) + " " + tr("footAva"));
  return lines.join("\n");
}
async function shareReport(spot) {
  const body = reportText(spot), report = reportDay(spot);
  if (!body) return;
  if (navigator.share) { try { await navigator.share({ title: "Bergwetter · " + spot.name, text: body }); } catch (error) { /* closed by the user */ } return; }
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([body], { type: "text/plain;charset=utf-8" }));
  link.download = "bergwetter-" + spot.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + report.day.date + ".txt";
  document.body.appendChild(link); link.click(); link.remove();
}
function printReport(spot) {
  document.getElementById("print").innerHTML = renderReport(spot);
  window.print();
}
function render() {
  const spot = view.name === "spot" ? findSpot(view.id) : null;
  if (view.name === "spot" && !spot) view = { name: "home", tab: "day", day: 0 };
  document.documentElement.lang = state.lang;
  document.getElementById("app").innerHTML = spot ? renderSpot(spot) : renderHome();
}

/* ---------- Loading and saving ---------- */
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && Array.isArray(saved.spots)) state = { lang: LANGS.includes(saved.lang) ? saved.lang : state.lang, spots: saved.spots, cache: saved.cache || {}, sort: saved.sort || "country" };
  } catch (error) { /* start empty */ }
  for (const id in state.cache) if (state.cache[id].forecast && state.cache[id].forecast.days.some(day => !day.hours || (day.hours[0] && day.hours[0].isDay === undefined))) delete state.cache[id];
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (error) { /* storage unavailable */ } }
async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}
function loadHistory() {
  if (!historyPromise) historyPromise = fetchJson(HISTORY_URL).then(json => { historyDays = Array.isArray(json.days) ? json.days : []; }).catch(() => { historyDays = []; })
    .then(() => { if (!document.querySelector("#results button, #q:focus")) render(); });
}
function getBulletin(lang) {
  if (!bulletinPromises[lang]) bulletinPromises[lang] = fetchJson(bulletinUrl(lang)).catch(error => { delete bulletinPromises[lang]; throw error; });
  return bulletinPromises[lang];
}
/* Separate request that is not waited for, so cloud data never delays or blocks the forecast and the bulletin. */
async function loadCloud(spot, entry) {
  try {
    entry.cloud = shapeCloud(await fetchJson(cloudUrl(spot)), entry.forecast.elevation);
    saveState();
    if (!document.querySelector("#results button, #q:focus")) render();
  } catch (error) { /* keep the last saved cloud data */ }
}
async function loadCompare(spot, entry) {
  try {
    entry.compare = shapeCompare(await fetchJson(compareUrl(spot)));
    saveState();
    if (!document.querySelector("#results button, #q:focus")) render();
  } catch (error) { /* reliability is simply not shown */ }
}
// One-time lookup of the country for favourites saved before countries were stored.
async function fillCountry(spot) {
  if (spot === EXAMPLE_SPOT || spot.cc || spot.ccTried) return;
  spot.ccTried = true;
  try {
    const json = await fetchJson("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=3&lat=" + spot.lat + "&lon=" + spot.lon);
    spot.cc = String((json.address || {}).country_code || "").toUpperCase() || undefined;
  } catch (error) { /* stays ungrouped */ }
  saveState();
  if (!document.querySelector("#results button, #q:focus")) render();
}
function hasValues(json) {
  return !!(json && json.hourly && (json.hourly.temperature_2m || []).some(value => value !== null && value !== undefined));
}
// The MeteoSwiss models cover the Alps and central Europe only; elsewhere fall back to Open-Meteo's best match.
async function loadForecast(spot) {
  let json = null;
  try { json = await fetchJson(forecastUrl(spot, "meteoswiss_icon_seamless")); } catch (error) { json = null; }
  const wide = !hasValues(json);
  if (wide) json = await fetchJson(forecastUrl(spot, "best_match"));
  if (!hasValues(json)) throw new Error("no forecast values");
  const forecast = shapeForecast(json);
  forecast.wide = wide;
  return forecast;
}
async function refreshSpot(spot) {
  const entry = state.cache[spot.id] || (state.cache[spot.id] = {});
  entry.error = false;
  try { entry.forecast = await loadForecast(spot); } catch (error) { entry.error = true; }
  if (entry.forecast && entry.forecast.elevation !== null) loadCloud(spot, entry);
  if (entry.forecast) loadCompare(spot, entry);
  fillCountry(spot);
  try {
    const bulletin = await getBulletin(state.lang);
    if (!bulletin.features || !bulletin.features.length) entry.avalanche = { status: "none" };
    else { const feature = findBulletinFeature(bulletin, spot.lat, spot.lon); entry.avalanche = feature ? { status: "ok", summary: summarizeBulletin(feature) } : { status: "outside" }; }
  } catch (error) { if (!entry.avalanche || entry.avalanche.status !== "ok") entry.avalanche = { status: "error" }; }
  saveState();
  if (!document.querySelector("#results button, #q:focus")) render();
}
function addSpot(name, lat, lon, elevation, place) {
  const spot = { id: "s" + Date.now(), name, lat, lon };
  if (place && place.country_code) spot.cc = place.country_code;
  if (place) spot.kind = !place.postcode && placeKind(place) === tr("kindPeak") ? "peak" : "place";
  if (typeof elevation === "number") spot.elevation = elevation;
  state.spots.unshift(spot); saveState(); render(); refreshSpot(spot);
}
let searchResults = [];
// Postcodes of the Alpine countries come from OpenStreetMap, because the place search knows only some of them.
async function postcodeLookup(code) {
  const rows = await fetchJson("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=" + NEAR_COUNTRIES.join(",").toLowerCase() +
    "&accept-language=" + state.lang + "&postalcode=" + encodeURIComponent(code));
  const seen = {};
  return (Array.isArray(rows) ? rows : []).map(row => {
    const address = row.address || {};
    return { name: address.city || address.town || address.village || address.municipality || address.county || row.name || code, latitude: Number(row.lat), longitude: Number(row.lon),
      admin1: address.state, country: address.country, country_code: String(address.country_code || "").toUpperCase(), postcode: code };
  }).filter(place => isFinite(place.latitude) && isFinite(place.longitude) && !seen[place.name + place.country_code] && (seen[place.name + place.country_code] = true));
}
function placeKind(place) {
  if (place.postcode) return tr("kindPost") + " " + place.postcode;
  return /^(MT|MTS|PK|PKS|RDGE|PASS|GLCR|HLL)$/.test(place.feature_code || "") ? tr("kindPeak") : tr("kindPlace");
}
function renderResults() {
  const rank = place => { const index = NEAR_COUNTRIES.indexOf(place.country_code); return (place.postcode ? -10 : 0) + (index < 0 ? NEAR_COUNTRIES.length : index); };
  searchResults = searchResults.map((place, index) => ({ place, index })).sort((a, b) => rank(a.place) - rank(b.place) || a.index - b.index).map(item => item.place);
  let html = "", country = null;
  searchResults.forEach((place, index) => {
    const land = countryName(place.country_code, place.country);
    if (land !== country) { country = land; html += '<div class="label">' + esc(country) + "</div>"; }
    html += '<button type="button" data-pick="' + index + '">' + (placeKind(place) === tr("kindPeak") ? icon("peak_clear", 20) : "") + "<span>" + esc(place.name) + '</span><span class="small muted">' +
      esc([placeKind(place), place.admin1, typeof place.elevation === "number" ? Math.round(place.elevation) + " m" : ""].filter(Boolean).join(" · ")) + "</span></button>";
  });
  return html;
}
async function zipLookup(code) {
  const countries = code.length === 5 ? ["DE", "IT", "FR"] : ["CH", "AT", "LI"], places = [];
  const answers = await Promise.all(countries.map(country => fetchJson("https://api.zippopotam.us/" + country.toLowerCase() + "/" + code).catch(() => null)));
  answers.forEach((answer, index) => ((answer && answer.places) || []).slice(0, 5).forEach(item => places.push({ name: item["place name"], latitude: Number(item.latitude), longitude: Number(item.longitude),
    admin1: item.state, country_code: countries[index], postcode: code })));
  return places.filter(place => place.name && isFinite(place.latitude) && isFinite(place.longitude));
}
// submit: the user pressed the button. OpenStreetMap's search may only be asked then, not while typing.
async function findPlaces(query, submit) {
  const lookup = async text => (await fetchJson(geocodeUrl(text))).results || [], mixed = /^(\d{4,5})\s+(.+)$/.exec(query), code = (/^(\d{4,5})(\s|$)/.exec(query) || [])[1];
  let byCode = [];
  if (code) byCode = await zipLookup(code).catch(() => []);
  if (code && !byCode.length && submit) byCode = await postcodeLookup(code).catch(() => []);
  if (byCode.length) return byCode;
  let places = await lookup(query);
  if (!places.length && mixed) places = await lookup(mixed[2]);
  return places;
}
let searchRun = 0, searchTimer = null;
async function showPlaces(query, submit) {
  const results = document.getElementById("results"), run = ++searchRun;
  if (submit) results.innerHTML = '<p class="muted" style="margin:0">' + esc(tr("searching")) + "</p>";
  try {
    const places = await findPlaces(query, submit), input = document.getElementById("q");
    if (run !== searchRun || !input || input.value.trim() !== query) return;
    searchResults = places;
    results.innerHTML = places.length ? renderResults() : submit ? '<p class="muted" style="margin:0">' + esc(tr("nothing")) + "</p>" : "";
  } catch (error) { if (submit && run === searchRun) results.innerHTML = '<p class="err" style="margin:0">' + esc(tr("searchFailed")) + "</p>"; }
}
function onSearch(event) {
  event.preventDefault();
  clearTimeout(searchTimer);
  const query = document.getElementById("q").value.trim();
  if (!query) return;
  const coordinates = parseCoordinates(query);
  if (coordinates) return addSpot(coordinates.lat.toFixed(3) + ", " + coordinates.lon.toFixed(3), coordinates.lat, coordinates.lon);
  showPlaces(query, true);
}
function onType(value) {
  clearTimeout(searchTimer);
  const query = value.trim();
  if (query.length < 3 || parseCoordinates(query)) { searchRun++; document.getElementById("results").innerHTML = ""; return; }
  searchTimer = setTimeout(() => showPlaces(query, false), 350);
}
function onClick(event) {
  const target = event.target.closest("[data-lang],[data-sort],[data-open],[data-home],[data-tab],[data-day],[data-remove],[data-pick],[data-print],[data-share]");
  if (!target) return;
  const data = target.dataset;
  if (data.lang) { state.lang = data.lang; saveState(); render(); shownSpots().forEach(refreshSpot); }
  else if (data.sort) { state.sort = data.sort; saveState(); render(); }
  else if (data.open) { location.hash = "spot-" + data.open; }
  else if (data.home) { location.hash = ""; }
  else if (data.tab) { view.tab = data.tab; render(); }
  else if (data.day) { view.day = Number(data.day); render(); }
  else if (data.remove) { state.spots = state.spots.filter(spot => spot.id !== data.remove); delete state.cache[data.remove]; saveState(); location.hash = ""; render(); if (!state.spots.length) refreshSpot(EXAMPLE_SPOT); }
  else if (data.print || data.share) { const spot = findSpot(data.print || data.share); if (spot) (data.print ? printReport : shareReport)(spot); }
  else if (data.pick) { const place = searchResults[Number(data.pick)]; addSpot(place.name, place.latitude, place.longitude, place.elevation, place); }
}
function onHash() {
  const match = /^#spot-(.+)$/.exec(location.hash);
  view = match ? { name: "spot", id: match[1], tab: "day", day: 0 } : { name: "home", tab: "day", day: 0 };
  render(); window.scrollTo(0, 0);
}
function init() {
  const browserLang = (navigator.language || "en").slice(0, 2);
  if (LANGS.includes(browserLang)) state.lang = browserLang;
  loadState();
  document.addEventListener("click", onClick);
  document.addEventListener("submit", event => { if (event.target.id === "search") onSearch(event); });
  document.addEventListener("input", event => { if (event.target.id === "q") onType(event.target.value); });
  window.addEventListener("hashchange", onHash);
  onHash();
  loadHistory();
  shownSpots().forEach(refreshSpot);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (typeof document !== "undefined") init();
